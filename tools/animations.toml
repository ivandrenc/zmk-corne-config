# Animation manifest for the claude_view nice!view shield.
#
# Run to regenerate claude_art.c:
#   python3 tools/nicview_frames.py --manifest tools/animations.toml \
#       --output boards/shields/claude_view/assets/claude_art.c
#
# Boot animation: INITIAL_ANIM in boards/shields/claude_view/behaviors/anim_select.c
# (0 = look, 1 = gym, 2 = confetti). Boo disabled in manifest below — re-enable and regenerate to add back.
#
# Runtime switching: &anim_look, &anim_gym, &anim_party, or &anim_cyc on the Fn layer
# (BEHAVIOR_LOCALITY_GLOBAL — same split pipe as RGB underglow).

[[animations]]
name         = "look"
dir          = "Claude Looking JPG Sequence"
# Skip hold (ezgif 27–130); look up 1–26 then return 131–149 (~45 steps).
skip_range   = [27, 130]
ms_per_frame = 20



[[animations]]
name         = "gym"
dir          = "claude-gym-animation-frames"
ms_per_frame = 120

# --- boo: disabled (smaller firmware / easier UF2 flash). Uncomment the block and run
#     nicview_frames.py to ship boo again; then restore anim_boo in the keymap and set
#     anim_party animation-index to <3>.
# [[animations]]
# name         = "boo"
# dir          = "boo-animation-frames"
# ms_per_frame = 100

[[animations]]
name         = "confetti"
dir          = "claude-confetti"
ms_per_frame = 80
