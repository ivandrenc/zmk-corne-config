# Animation manifest for the claude_view nice!view shield.
#
# Run to regenerate claude_art.c:
#   python3 tools/nicview_frames.py --manifest tools/animations.toml \
#       --output boards/shields/claude_view/assets/claude_art.c
#
# Which clip plays at boot: set INITIAL_ANIM in
# boards/shields/claude_view/behaviors/anim_select.c (0 = wave, 1 = gym).
# ZMK v0.3 BLE peripherals omit keymap/layer events on the display MCU, so
# keybindings cannot switch animations without upstream firmware changes.

[[animations]]
name         = "wave"
dir          = "mascot-frames-waving-flag"
sequence     = "1,2,3,4"
ms_per_frame = 200

[[animations]]
name         = "gym"
dir          = "claude-gym-animation-frames"
ms_per_frame = 80
