# Animation manifest for the claude_view nice!view shield.
#
# Run to regenerate claude_art.c:
#   python3 tools/nicview_frames.py --manifest tools/animations.toml \
#       --output boards/shields/claude_view/assets/claude_art.c
#
# Boot animation: INITIAL_ANIM in boards/shields/claude_view/behaviors/anim_select.c
# (0 = look, 1 = gym, 2 = boo).
#
# Runtime switching: &anim_look, &anim_gym, &anim_boo, or &anim_cyc on the Fn layer
# (BEHAVIOR_LOCALITY_GLOBAL — same split pipe as RGB underglow).

[[animations]]
name         = "look"
dir          = "Claude Looking JPG Sequence"
# Omit sequence → all frames in directory order (sorted by filename).
ms_per_frame = 60

[[animations]]
name         = "gym"
dir          = "claude-gym-animation-frames"
ms_per_frame = 80

[[animations]]
name         = "boo"
dir          = "boo-animation-frames"
ms_per_frame = 100
