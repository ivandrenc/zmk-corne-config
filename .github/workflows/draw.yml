name: Draw Keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - .github/workflows/draw.yml
      - keymap_drawer.config.yaml

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      destination: commit
      # Fold SVG/YAML into the commit that changed config (avoids a second commit racing main).
      amend_commit: true
      fail_on_error: true
